[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jungle"
version = "0.1.0"
description = "Windows desktop Jungle / Dou Shou Qi game with GUI and AI engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pillow>=12.2.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pyinstaller>=6.19.0",
]

[project.scripts]
jungle = "jungle.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jungle.ai" = ["data/*.jgtb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
